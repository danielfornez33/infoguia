<div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-3">
  <div class="card">
    <div class="card-label">Empresas</div>
    <div class="card-value">{{ stats.companies }}</div>
  </div>
  <div class="card">
    <div class="card-label">Sedes</div>
    <div class="card-value">{{ stats.branches }}</div>
  </div>
  <div class="card">
    <div class="card-label">Contactos</div>
    <div class="card-value">{{ stats.contacts }}</div>
  </div>
  <div class="card">
    <div class="card-label">WhatsApp</div>
    <div class="card-value text-emerald-400">{{ stats.whatsapp }}</div>
  </div>
  <div class="card">
    <div class="card-label">Email</div>
    <div class="card-value text-sky-400">{{ stats.email }}</div>
  </div>
  <div class="card">
    <div class="card-label">Verificadas</div>
    <div class="card-value text-amber-400">{{ stats.verified }}</div>
  </div>
  <div class="card">
    <div class="card-label">Cola</div>
    <div class="card-value">{{ stats.queue.pending }}</div>
  </div>
  <div class="card">
    <div class="card-label">Workers</div>
    <div class="card-value text-violet-400">{{ stats.workers_online }}</div>
  </div>
</div>

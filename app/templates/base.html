<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}InfoGuia{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon"></div>
          <span>InfoGuia</span>
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <div class="sidebar-section">
          <div class="sidebar-section-title">Principal</div>
          <a href="/" class="sidebar-link {% if request.url.path == '/' %}active{% endif %}">
            <svg class="sidebar-link-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Dashboard
          </a>
          <a href="/companies" class="sidebar-link {% if '/companies' in request.url.path %}active{% endif %}">
            <svg class="sidebar-link-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
            Empresas
          </a>
        </div>
        
        <div class="sidebar-section">
          <div class="sidebar-section-title">Operations</div>
          <a href="/queue" class="sidebar-link {% if request.url.path == '/queue' %}active{% endif %}">
            <svg class="sidebar-link-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
            </svg>
            Cola
          </a>
          <a href="/logs" class="sidebar-link {% if request.url.path == '/logs' %}active{% endif %}">
            <svg class="sidebar-link-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            Logs
          </a>
        </div>
        
        <div class="sidebar-section">
          <div class="sidebar-section-title">System</div>
          <a href="/settings" class="sidebar-link {% if request.url.path == '/settings' %}active{% endif %}">
            <svg class="sidebar-link-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            Ajustes
          </a>
        </div>
      </nav>
      
      <div class="sidebar-footer">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs text-secondary">Status</span>
          <span id="system-status" class="badge badge-success">Online</span>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-sm btn-ghost flex-1" onclick="controlAction('resume')">Play</button>
          <button class="btn btn-sm btn-ghost flex-1" onclick="controlAction('pause')">Pause</button>
          <button class="btn btn-sm btn-danger flex-1" onclick="controlAction('stop')">Stop</button>
        </div>
      </div>
    </aside>
    
    <!-- Main content -->
    <main class="main-content">
      <!-- Topbar -->
      <div class="topbar">
        {% block breadcrumb %}
        <div class="topbar-breadcrumb">
          <span class="topbar-breadcrumb-current">InfoGuia BI</span>
        </div>
        {% endblock %}
        
        <div class="topbar-actions">
          {% block topbar_actions %}{% endblock %}
        </div>
      </div>
      
      <!-- Page content -->
      <div class="page">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  
  <script src="/static/app.js"></script>
  <script>
    function controlAction(action) {
      fetch(`/api/control/${action}`, { 
        method: 'POST'
      })
        .then(res => res.json())
        .then(data => {
          console.log('Control:', data);
          if (data.mode) {
            const badge = document.getElementById('system-status');
            if (badge) {
              badge.textContent = data.mode;
              badge.className = 'badge badge-' + (data.mode === 'running' ? 'success' : 'warning');
            }
          }
        });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
